<!DOCTYPE html>
<html>
<head>
  <title>User Tracking</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

  <!-- Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAP_KEY"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 🔥 SAME CONFIG AS DRIVER
  const firebaseConfig = {
     apiKey: "AIzaSyDMIKFrs097bUb7h0bh9Oim1eT-Ih6EEeU",
    authDomain: "track-my-ride-953ea.firebaseapp.com",
    databaseURL: "https://track-my-ride-953ea-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "track-my-ride-953ea",
    storageBucket: "track-my-ride-953ea.firebasestorage.app",
    messagingSenderId: "112265337540",
    appId: "1:112265337540:web:20a98ca087a97a2c7f0791",
    measurementId: "G-V183L00NBM"
  };

  firebase.initializeApp(firebaseConfig);

  let map;
  let marker;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 15,
      center: { lat: 0, lng: 0 }
    });

    marker = new google.maps.Marker({
      map: map
    });

    // 📡 Listen for driver location
    firebase.database().ref("location").on("value", (snapshot) => {
      const data = snapshot.val();

      if (data) {
        const pos = { lat: data.lat, lng: data.lng };

        marker.setPosition(pos);
        map.setCenter(pos);
      }
    });
  }

  initMap();
</script>

</body>
</html>
