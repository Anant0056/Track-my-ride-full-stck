<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

/* KEEP YOUR BACKGROUND */
background: url("GGJaS9VXwAAM_Mx.jfif");
background-size:cover;
background-position:center;

color:white;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:16px;
width:300px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input, select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:10px;
outline:none;
}

button{
width:100%;
padding:12px;
background:black;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

h3{text-align:center;}

#error{
color:red;
text-align:center;
margin-top:10px;
font-size:13px;
}
</style>
</head>

<body>

<div class="box">

<h3>CU Login</h3>

<select id="role">
<option value="driver">Driver</option>
<option value="user">User</option>
</select>

<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="error"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyDMIKFrs097bUb7h0bh9Oim1eT-Ih6EEeU",
 authDomain: "track-my-ride-953ea.firebaseapp.com",
 databaseURL: "https://track-my-ride-953ea-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "track-my-ride-953ea",
 storageBucket: "track-my-ride-953ea.firebasestorage.app",
 messagingSenderId: "112265337540",
 appId: "1:112265337540:web:20a98ca087a97a2c7f0791"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function(){

const email = document.getElementById("email").value.trim();
const pass = document.getElementById("pass").value.trim();
const role = document.getElementById("role").value;

const errorBox = document.getElementById("error");
errorBox.innerText = "";

try{

const user = await signInWithEmailAndPassword(auth,email,pass);

localStorage.setItem("uid",user.user.uid);
localStorage.setItem("role",role);

/* ROLE BASED REDIRECT */
if(role === "driver"){
window.location = "driver.html";
}else{
window.location = "user.html";
}

}catch(err){
errorBox.innerText = err.message;
}

};
</script>

</body>
</html>
