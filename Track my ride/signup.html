<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU Transport Signup</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
min-height:100vh;
background:
linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.82)),
url('Transportation-banner.jpg');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:flex-end;
color:white;
}

/* TOP */

.top{
padding:24px;
padding-top:34px;
}

.brand{
display:inline-block;
padding:8px 14px;
background:rgba(255,255,255,0.12);
border-radius:50px;
font-size:12px;
margin-bottom:16px;
}

h1{
font-size:30px;
line-height:1.2;
font-weight:800;
margin-bottom:14px;
}

.sub{
font-size:14px;
line-height:1.6;
opacity:.95;
}

/* BOTTOM PANEL */

.panel{
background:white;
color:#111;
padding:24px;
border-radius:28px 28px 0 0;
box-shadow:0 -10px 25px rgba(0,0,0,0.2);
}

.panel h2{
font-size:24px;
margin-bottom:8px;
}

.panel p{
font-size:14px;
line-height:1.6;
color:#555;
margin-bottom:16px;
}

label{
font-size:13px;
font-weight:700;
display:block;
margin-top:10px;
margin-bottom:6px;
}

input,select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:16px;
font-size:15px;
outline:none;
background:#fafafa;
}

input:focus,select:focus{
border-color:#f4c430;
background:white;
}

button{
width:100%;
padding:15px;
margin-top:18px;
border:none;
border-radius:16px;
font-size:16px;
font-weight:700;
cursor:pointer;
background:#f4c430;
color:black;
}

.extra{
margin-top:14px;
text-align:center;
font-size:13px;
color:#666;
}

.extra a{
color:#111;
font-weight:700;
text-decoration:none;
}
</style>
</head>

<body>

<div class="top">

<div class="brand">
📝 Chandigarh University Registration
</div>

<h1>
Create Your <br>
CU Account
</h1>

<div class="sub">
Register to use real-time shuttle tracking, student transport services, and driver access.
</div>

</div>

<div class="panel">

<h2>Signup</h2>
<p>Create a secure account to continue.</p>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter full name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Password</label>
<input type="password" id="password" placeholder="Create password">

<label>Select Role</label>
<select id="role">
<option value="user">👤 Student / User</option>
<option value="driver">🚗 Driver</option>
</select>

<button onclick="signupNow()">Create Account</button>

<div class="extra">
Already have account? <a href="login.html">Login</a>
</div>

</div>

<script>
function signupNow(){
alert("Account Created Successfully");
window.location="login.html";
}
</script>

</body>
</html>
